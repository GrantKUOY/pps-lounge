<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="手機優先的 Priority Pass 全球機場貴賓室中文查詢工具。">
  <meta name="robots" content="noindex">
  <title>PPS Lounge v2｜快速找機場貴賓室</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="PPS Lounge 首頁">
      <span class="brand-mark" aria-hidden="true">P</span>
      <span>PPS Lounge</span>
      <span class="beta">v2 預覽</span>
    </a>
    <button class="quiet-button" id="download-button" type="button" disabled>匯出 CSV</button>
  </header>

  <main>
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Priority Pass 中文指南</p>
      <h1 id="page-title">快速找到機場貴賓室。</h1>
      <p class="hero-copy">輸入三碼機場代碼、城市或機場名稱，立即查看位置、營業時間、使用條件與設施。</p>

      <div class="search-shell">
        <label for="search">搜尋機場</label>
        <div class="search-control">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="search" type="search" inputmode="search" autocomplete="off"
            placeholder="例如 TPE、東京、Narita" disabled>
          <button id="clear-search" class="icon-button" type="button" aria-label="清除搜尋" hidden>×</button>
        </div>
        <div id="suggestions" class="suggestions" role="listbox" aria-label="搜尋建議" hidden></div>
      </div>

      <div class="recent-wrap" id="recent-wrap" hidden>
        <span>最近搜尋</span>
        <div id="recent-searches" class="chip-row"></div>
      </div>
    </section>

    <section class="results-section" aria-labelledby="results-title">
      <div class="toolbar">
        <div>
          <p class="eyebrow">搜尋結果</p>
          <h2 id="results-title">全球機場據點</h2>
        </div>
        <button id="open-filters" class="secondary-button" type="button">進階篩選</button>
      </div>

      <div class="quick-filters" aria-label="快速篩選">
        <button class="filter-chip active" type="button" data-quick-filter="">全部</button>
        <button class="filter-chip" type="button" data-quick-filter="Showers">有淋浴</button>
        <button class="filter-chip" type="button" data-quick-type="LOUNGE">貴賓室</button>
        <button class="filter-chip" type="button" data-quick-type="EAT">餐飲</button>
      </div>

      <p id="result-summary" class="result-summary" aria-live="polite">正在載入正式資料…</p>
      <div id="loading-state" class="state-card">正在載入 1,754 筆機場據點資料…</div>
      <div id="error-state" class="state-card error" hidden>
        <strong>資料載入失敗</strong>
        <p>請檢查連線後重新載入，不會影響正式 PPS 網站。</p>
        <button id="retry-button" class="primary-button" type="button">重新載入資料</button>
      </div>
      <div id="empty-state" class="state-card" hidden>
        <strong>找不到符合條件的據點</strong>
        <p>請檢查機場代碼，或清除部分篩選條件。</p>
        <button id="empty-clear" class="secondary-button" type="button">清除篩選</button>
      </div>
      <div id="results" class="result-grid" aria-live="polite"></div>

      <nav class="pagination" aria-label="搜尋結果分頁">
        <button id="prev-page" class="secondary-button" type="button" disabled>上一頁</button>
        <span id="page-info">第 1 / 1 頁</span>
        <button id="next-page" class="secondary-button" type="button" disabled>下一頁</button>
      </nav>
    </section>
  </main>

  <dialog id="filters" class="sheet">
    <form method="dialog" class="sheet-panel" id="filter-form">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-header">
        <h2>進階篩選</h2>
        <button class="icon-button" value="cancel" aria-label="關閉篩選">×</button>
      </div>
      <div class="filter-grid">
        <label>國家／地區<select id="country-filter"><option value="">全部國家／地區</option></select></label>
        <label>城市<select id="city-filter"><option value="">全部城市</option></select></label>
        <label>據點類型<select id="type-filter"><option value="">全部類型</option></select></label>
        <label>設施<select id="facility-filter"><option value="">全部設施</option></select></label>
        <label>排序<select id="sort-filter">
          <option value="relevance">搜尋相關度</option>
          <option value="airportCode">機場代碼</option>
          <option value="country">國家／城市</option>
          <option value="name">據點名稱</option>
        </select></label>
        <label>每頁顯示<select id="page-size-filter">
          <option value="12">12 筆</option>
          <option value="24" selected>24 筆</option>
          <option value="48">48 筆</option>
        </select></label>
      </div>
      <div class="sheet-actions">
        <button id="clear-filters" class="secondary-button" type="button">清除篩選</button>
        <button class="primary-button" value="apply" type="submit">套用篩選</button>
      </div>
    </form>
  </dialog>

  <dialog id="detail" class="detail-dialog">
    <article class="detail-panel">
      <div class="sheet-header">
        <button id="close-detail" class="back-button" type="button">‹ 返回結果</button>
        <button id="close-detail-icon" class="icon-button" type="button" aria-label="關閉詳情">×</button>
      </div>
      <div id="detail-content"></div>
    </article>
  </dialog>

  <footer>
    <p>資料僅供行程規劃參考，實際權益、開放時間與入場條件請以 Priority Pass 官方頁面為準。</p>
  </footer>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
